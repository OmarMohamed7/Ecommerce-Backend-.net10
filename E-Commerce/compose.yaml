services:
#  e-commerce:
#    image: e-commerce
#    build:
#      context: .
#      dockerfile: E-Commerce/Dockerfile
#
  postgres:
    image: postgres:latest
    container_name: products-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ProductsDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ProductDb" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: